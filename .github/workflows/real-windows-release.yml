name: Real Windows Release

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Published Real API URL
        required: false
        default: https://api.real-clients.ru
        type: string
  push:
    tags:
      - "real-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure desktop endpoints
        env:
          INPUT_API_URL: ${{ inputs.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $configPath = "artifacts/lead-scout-desktop/electron/runtime-config.json"
          $current = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($env:INPUT_API_URL) { $current.apiBaseUrl = $env:INPUT_API_URL }
          $current.updateUrl = "https://github.com/$env:REPOSITORY/releases/latest/download/"
          $current | ConvertTo-Json | Set-Content $configPath
      - name: Build Real application payload
        run: pnpm --filter @workspace/lead-scout-desktop run build:desktop:dir
      - name: Build custom Real installer
        run: pnpm --filter @workspace/lead-scout-desktop run build:installer
      - name: Create custom update manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          $package = Get-Content artifacts/lead-scout-desktop/package.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem artifacts/lead-scout-desktop/release -Filter "Real-Installer-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Custom Real installer was not generated." }
          $manifest = @{
            version = $package.version
            releaseName = "Real $($package.version)"
            installerUrl = "https://github.com/$env:REPOSITORY/releases/latest/download/$($installer.Name)"
          }
          $manifest | ConvertTo-Json | Set-Content artifacts/lead-scout-desktop/release/real-update.json
      - name: Upload generated Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Real-Windows
          path: |
            artifacts/lead-scout-desktop/release/Real-Installer-*.exe
            artifacts/lead-scout-desktop/release/real-update.json
          if-no-files-found: error
          retention-days: 30

  verify-custom-installer:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download generated release
        uses: actions/download-artifact@v4
        with:
          name: Real-Windows
          path: release
      - name: Verify custom installer and manifest
        run: |
          $installer = Get-ChildItem release -Filter "Real-Installer-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Custom Real installer was not found." }
          $manifest = Get-Content release/real-update.json -Raw | ConvertFrom-Json
          if ([String]::IsNullOrWhiteSpace($manifest.version)) { throw "Update manifest has no version." }
          if ([String]::IsNullOrWhiteSpace($manifest.installerUrl)) { throw "Update manifest has no installer URL." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          [PSCustomObject]@{
            installer = $installer.Name
            sha256 = $hash
            version = $manifest.version
            result = "pass"
          } | ConvertTo-Json | Set-Content release/installer-verification.json
      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: Real-installer-verification
          path: release/installer-verification.json
          if-no-files-found: error

  publish:
    needs:
      - build
      - verify-custom-installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download generated release
        uses: actions/download-artifact@v4
        with:
          name: Real-Windows
          path: release
      - name: Download verification report
        uses: actions/download-artifact@v4
        with:
          name: Real-installer-verification
          path: release
      - name: Create Windows release archive
        run: |
          $installer = Get-ChildItem release -Filter "Real-Installer-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Custom Real installer was not found." }
          $archive = Join-Path (Get-Location) ("release/{0}.zip" -f [IO.Path]::GetFileNameWithoutExtension($installer.Name))
          $files = @(
            $installer.FullName
            (Join-Path (Get-Location) "release/real-update.json")
            (Join-Path (Get-Location) "release/installer-verification.json")
          )
          Compress-Archive -Path $files -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) { throw "Release archive was not created: $archive" }
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes
          }
          $installer = Get-ChildItem release -Filter "Real-Installer-*.exe" | Select-Object -First 1
          $archive = Get-ChildItem release -Filter "Real-Installer-*.zip" | Select-Object -First 1
          $files = @(
            $installer.FullName
            (Join-Path (Get-Location) "release/real-update.json")
            (Join-Path (Get-Location) "release/installer-verification.json")
            $archive.FullName
          )
          foreach ($file in $files) {
            if ([String]::IsNullOrWhiteSpace($file) -or -not (Test-Path $file)) {
              throw "Release asset was not found: $file"
            }
            gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY $file --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $file"
            }
          }